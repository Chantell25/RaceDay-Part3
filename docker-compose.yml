services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    ports:
      - "1433:1433"
    volumes:
      - raceday-sql:/var/opt/mssql
  api:
    build:
      context: .
      dockerfile: RaceDay.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DisableHttpsRedirection: "true"
      ConnectionStrings__RaceDay: "Server=sql,1433;Database=RaceDayDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      AzureBlobStorage__ConnectionString: "${AZURE_BLOB_CONNECTION_STRING}"
      AzureBlobStorage__ContainerName: "raceday-images"
    depends_on:
      - sql
    ports:
      - "8081:8080"
  mvc:
    build:
      context: .
      dockerfile: RaceDay.Mvc/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Api__BaseUrl: "http://api:8080/"
    depends_on:
      - api
    ports:
      - "8080:8080"
volumes:
  raceday-sql:
