name: RaceDay Part 3 CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raceday-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    name: Restore, build and test API + MVC (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Validate submission structure
        run: |
          test -f RaceDay.sln
          test -f RaceDay.Api/RaceDay.Api.csproj
          test -f RaceDay.Mvc/RaceDay.Mvc.csproj
          test -f RaceDay.Api/Dockerfile
          test -f RaceDay.Mvc/Dockerfile
          test -f docker-compose.yml
          test -f README.md
      - name: Restore
        run: dotnet restore RaceDay.sln
      - name: Build all solution projects
        run: dotnet build RaceDay.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test RaceDay.sln -c Release --no-build --logger "console;verbosity=normal"
